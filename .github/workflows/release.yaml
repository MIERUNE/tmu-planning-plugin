name: export_plugin
on:
  release:
    types: [published]

env:
  PLUGIN_NAME: GreenInfraPlannerJP
  # class.mbtiles は git 管理せず、このタグのドラフトリリースにアセットとして保管している
  DATA_RELEASE_TAG: data-class-mbtiles
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # ドラフトリリースの参照とアセットのアップロードに必要
      contents: write
    steps:
      - uses: actions/checkout@v2
        with:
          # labels.mbtiles は Git LFS 管理のため、実体を取得する
          lfs: true
      # Temporarily rename metadata file whose contents are to be rewritten
      - name: rename some files to rewrite
        run: |
          cp ./metadata.txt ./metadata.old.txt
      # Write version information in metadata.txt from github release tag
      - name: metadata
        run : |
          sed -e "s/version={{PLUGIN_VERSION}}/version=${{ github.event.release.tag_name }}/g" ./metadata.old.txt > ./metadata.txt
          rm ./metadata.old.txt
      - name: Create Plugin Directory
        run: |
          mkdir ${{env.PLUGIN_NAME}}
          find . -type f | grep -ve './.git' \
            -ve '.github' \
            -ve './.vscode' \
            -ve '__pycache__/' \
            -ve './tests' \
            -ve './pyproject.toml' \
            -ve './.gitignore' \
            -ve './.python-version' \
            -ve './README.md' \
            -ve './docs' \
            -ve './test_suite.py' \
            -ve './scripts' \
            -ve './uv.lock' | xargs -I src cp --parents src ${{env.PLUGIN_NAME}}
      # 行政区域のローカルデータなし（APIのみ版）
      - name: Create Archive
        run: |
          zip -r ${{env.PLUGIN_NAME}}.zip ./${{env.PLUGIN_NAME}}
      - name: Download local data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{env.DATA_RELEASE_TAG}} \
            --pattern class.mbtiles \
            --dir ${{env.PLUGIN_NAME}}/features/administrative_area/data
      # 行政区域のローカルデータ（class.mbtiles）同梱版
      - name: Create Archive with local data
        run: |
          zip -r ${{env.PLUGIN_NAME}}_with_local_data.zip ./${{env.PLUGIN_NAME}}
      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            ${{env.PLUGIN_NAME}}.zip \
            ${{env.PLUGIN_NAME}}_with_local_data.zip
